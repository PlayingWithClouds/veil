type Query {
  vpnStatus: VpnStatus!
  stream(url: String!, pluginName: String): StreamResult
  checkProviderSpeeds(id: ID!): [ProviderSpeed!]!
  blocklist: [BlocklistEntry!]!
  changes(targetId: ID!, key: String, limit: Int, offset: Int): [Change!]!
  collections(search: String, tagId: ID, origin: String, limit: Int, offset: Int): [Collection!]!
  collection(id: ID!): Collection
  collectionMembers(collectionId: ID!): [CollectionMember!]!
  collectionIdsForMedia(mediaId: ID!): [ID!]!
  galleries(limit: Int, offset: Int, search: String, studioId: ID, performerId: ID, tagId: ID, sources: [String!]): [Gallery!]!
  gallery(id: ID!): Gallery
  images(limit: Int, offset: Int, search: String, studioId: ID, performerId: ID, tagId: ID, galleryId: ID, sort: String): [Image!]!
  image(id: ID!): Image
  jobs: [Job!]!
  job(id: ID!): Job
  downloadedScenes: [Scene!]!
  mediaCards(ids: [ID!]!): [MediaCard!]!
  oCount(mediaId: ID!): Int!
  observation(id: ID!): Observation
  observations(targetId: ID!, status: String, limit: Int, offset: Int): [Observation!]!
  performers(limit: Int, offset: Int, search: String, tagId: ID, sort: String): [Performer!]!
  performer(id: ID!): Performer
  plugins: [Plugin!]!
  plugin(id: ID!): Plugin
  pluginPackages(query: String): [PluginPackage!]!
  pluginCategories(plugin: String!, limit: Int): [PluginCategory!]!
  recommendations(limit: Int, offset: Int, refresh: Boolean, sources: [String!]): [RecommendedScene!]!
  recommendedRows(rowLimit: Int, perRow: Int): [RecommendationRow!]!
  recommendedCategories(categoryLimit: Int, perCategory: Int): [RecommendedCategory!]!
  recommendationPair: [Scene!]!
  savedFilters: [SavedFilter!]!
  scenes(limit: Int, offset: Int, search: String, studioId: ID, performerId: ID, tagId: ID, sort: String, minRating: Float, minDuration: Int, maxDuration: Int, dateFrom: String, dateTo: String, sources: [String!]): [Scene!]!
  scene(id: ID!): Scene
  randomScenes(limit: Int): [Scene!]!
  recommendedFeed(limit: Int, offset: Int): [Scene!]!
  sceneMarkers(mediaId: ID!): [SceneMarker!]!
  pluginSearch(query: String!, limit: Int, pluginNames: [String!]): [PluginSearchResult!]!
  pluginBrowse(limit: Int, offset: Int): [PluginSearchResult!]!
  recommendedBrowse(limit: Int): [PluginSearchResult!]!
  findAlikeSources(sceneId: ID!, limit: Int): [AlikeCandidate!]!

  """
  Suggestions for a partially typed query. Empty query = recent searches plus taste-based picks.
  """
  searchSuggestions(query: String!, limit: Int = 12): [SearchSuggestion!]!
  settings: Settings!
  settingEntries(scope: String): [SettingEntry!]!
  mediaStreams(mediaId: ID!): [Stream!]!
  studios(limit: Int, offset: Int, search: String, tagId: ID, sort: String): [Studio!]!
  studio(id: ID!): Studio
  searchSubscriptions: [SearchSubscription!]!
  searchSubscription(id: ID!): SearchSubscription
  subscriptionForTarget(targetId: ID!): SearchSubscription
  subscriptionFeed(filter: SubscriptionFeedFilter, limit: Int, offset: Int): [SubscriptionFeedItem!]!
  tags(limit: Int, offset: Int, search: String, category: String): [Tag!]!
  tag(id: ID!): Tag
  userRating(mediaId: ID!): UserRating
  userRatings(limit: Int, offset: Int): [UserRating!]!
  watchHistory(limit: Int, offset: Int): [WatchHistory!]!
  watchHistoryEntry(mediaId: ID!): WatchHistory
  watchlist: [WatchlistItem!]!
}

type Mutation {
  scrape(pluginName: String!, url: String!): ScrapePayload!
  queueDownload(url: String!, title: String!, pluginName: String): ID!
  addBlock(kind: String!, targetId: ID!, label: String): BlocklistEntry!
  removeBlock(targetId: ID!): Boolean!
  createCollection(name: String!): Collection!
  renameCollection(collectionId: ID!, name: String!): Collection!
  deleteCollection(collectionId: ID!): Boolean!
  addToCollection(collectionId: ID!, mediaId: ID!): Boolean!
  removeFromCollection(collectionId: ID!, mediaId: ID!): Boolean!
  reorderCollection(collectionId: ID!, mediaIds: [ID!]!): Boolean!
  setCollectionTags(collectionId: ID!, tagIds: [ID!]!): Collection!
  ensureGalleryImages(galleryId: ID!): Gallery
  setImageTags(imageId: ID!, tagIds: [ID!]!): Image!
  deleteJob(id: ID!): Boolean!
  deleteJobsByKind(kind: String!): Int!
  clearJobs: Int!
  reorderDownloads(jobIds: [ID!]!): Boolean!
  retryJob(id: ID!): Boolean!
  incrementOCount(mediaId: ID!): Int!
  decrementOCount(mediaId: ID!): Int!
  updateObservationStatus(id: ID!, status: ObservationStatus!): Observation!
  setPerformerFavorite(id: ID!, favorite: Boolean!): Performer!
  enrichPerformer(id: ID!): Boolean!
  togglePlugin(name: String!, enabled: Boolean!): Boolean!
  updatePluginSettings(pluginName: String!, values: [PluginSettingValueInput!]!): Boolean!
  installPlugin(packageName: String!): Boolean!
  uninstallPlugin(name: String!): Boolean!
  updatePlugins: [String!]!
  recordRecommendationChoice(chosenMediaId: ID!, rejectedMediaId: ID!): Boolean!
  recordImpressions(impressions: [ImpressionInput!]!): Int!
  createSavedFilter(name: String!, filter: SceneFilterInput!): SavedFilter!
  deleteSavedFilter(filterId: ID!): Boolean!
  createSceneMarker(mediaId: ID!, seconds: Float!, endSeconds: Float, tagName: String, label: String): SceneMarker!
  deleteSceneMarker(markerId: ID!): Boolean!
  resolvePluginResult(pluginName: String!, url: String!, posterUrl: String): ID!
  attachAlikeSource(sceneId: ID!, pluginName: String!, url: String!): [Stream!]!
  ensureEntityScenes(entityId: ID!): Int!

  """Remembers a search the user ran (called when a search is submitted)."""
  recordSearch(query: String!): Boolean!

  """Removes a query from the recent searches."""
  forgetSearch(query: String!): Boolean!
  updateSettings(input: UpdateSettingsInput!): Settings!
  upsertSettingEntry(input: UpsertSettingEntryInput!): SettingEntry!
  deleteSettingEntry(id: ID!): Boolean!
  createStream(input: CreateStreamInput!): Stream!
  deleteStream(id: ID!): Boolean!
  ensureSceneStreams(sceneId: ID!): [Stream!]!
  setStudioTags(studioId: ID!, tagIds: [ID!]!): Studio!
  subscribeSearch(query: String!, sources: [String!], intervalHours: Int): SearchSubscription!
  subscribe(kind: SubscriptionKind!, targetId: ID!, intervalHours: Int): SearchSubscription!
  updateSearchSubscription(id: ID!, intervalHours: Int, enabled: Boolean): SearchSubscription!
  unsubscribeSearch(id: ID!): Boolean!
  runSearchSubscription(id: ID!): SearchSubscription!
  markSearchSubscriptionSeen(id: ID!): SearchSubscription!
  upsertUserRating(input: UpsertUserRatingInput!): UserRating!
  deleteUserRating(mediaId: ID!): Boolean!
  upsertWatchHistory(input: UpsertWatchHistoryInput!): WatchHistory!
  deleteWatchHistory(mediaId: ID!): Boolean!
  addToWatchlist(mediaId: ID!): WatchlistItem!
  removeFromWatchlist(mediaId: ID!): Boolean!
}

