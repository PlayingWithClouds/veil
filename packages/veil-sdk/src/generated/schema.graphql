scalar JSON

enum RecordKind {
  video
  gallery
  image
  audio
  story
  post
  performer
  studio
  camModel
  group
  tag
  category
  collection
  segment
  clip
}

enum MediaKind {
  video
  gallery
  audio
  story
  post
}

enum MediaStatus {
  available
  wanted
  unavailable
}

input RecordRefInput {
  kind: RecordKind!
  id: ID!
}

type RecordRef {
  kind: RecordKind!
  id: ID!
}

union Record = Video | Gallery | Performer | Studio | Tag

type UserState {
  subjectKind: RecordKind!
