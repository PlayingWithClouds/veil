type Query {
  play(url: String!): Playable
  videos(filter: MediaFilter, limit: Int, offset: Int): [Video!]!
  video(id: ID!): Video
  galleries(filter: MediaFilter, limit: Int, offset: Int): [Gallery!]!
  gallery(id: ID!): Gallery
  performers(text: String, limit: Int, offset: Int): [Performer!]!
  performer(id: ID!): Performer
  studios(text: String, limit: Int, offset: Int): [Studio!]!
  studio(id: ID!): Studio
  tags(text: String, limit: Int, offset: Int): [Tag!]!
  tag(id: ID!): Tag
  plugins: [Plugin!]!
  plugin(name: String!): Plugin
  pluginPackages(query: String): [PluginPackage!]!
}

type Mutation {
  scrape(plugin: String!, url: String!): Scraped!
  fetchVideo(id: ID!): Video
  fetchGallery(id: ID!): Gallery
  browse(plugin: String!, kind: ListKind!, query: String, limit: Int, offset: Int): Listed!
  search(kind: ListKind!, query: String!, limit: Int): Listed!
  setPluginEnabled(name: String!, enabled: Boolean!): Boolean!
  updatePluginSettings(plugin: String!, values: [PluginSettingValueInput!]!): Boolean!
  installPlugin(packageName: String!): Boolean!
  uninstallPlugin(name: String!): Boolean!
  updatePlugins: [String!]!
}

type Playable {
  url: String!
  mimeType: String!
  quality: String
}

type Scraped {
  kind: String!
  id: ID!
}

input MediaFilter {
  text: String
  performerId: ID
  studioId: ID
  tagId: ID
}

enum ListKind {
  VIDEO
  GALLERY
  PERFORMER
  STUDIO
  TAG
}

type Listed {
  videos: [Video!]!
  galleries: [Gallery!]!
  performers: [Performer!]!
  studios: [Studio!]!
  tags: [Tag!]!
}

type Asset {
  uri: String!
  mimeType: String
  width: Int
  height: Int
  blurhash: String
}

type Video {
  id: ID!
  createdAt: String!
  updatedAt: String!
  title: String!
  details: String
  date: String
  cover: Asset
  status: String!
  studio: Studio
  performers: [Performer!]!
  tags: [Tag!]!
  durationSeconds: Float
  width: Int
  height: Int
  vr: VrFormat
  preview: Asset
  trickplay: Trickplay
  gallery: Gallery
  sources: [Source!]!
  streams: [Stream!]!
}

type VrFormat {
  projection: String!
  stereo: String!
  fieldOfView: Int
}

type Trickplay {
  sheets: [Asset!]!
  columns: Int!
  rows: Int!
  tileWidth: Int!
  tileHeight: Int!
  intervalSeconds: Float!
}

type Gallery {
  id: ID!
  createdAt: String!
  updatedAt: String!
  title: String!
  details: String
  date: String
  cover: Asset
  status: String!
  studio: Studio
  performers: [Performer!]!
  tags: [Tag!]!
  imageCount: Int!
  images: [Image!]!
  video: Video
  sources: [Source!]!
}

type Image {
  id: ID!
  position: Int!
  asset: Asset!
  width: Int
  height: Int
}

type Performer {
  id: ID!
  createdAt: String!
  updatedAt: String!
  name: String!
  aliases: [String!]!
  image: Asset
  details: String
  attributes: PerformerAttributes!
  links: [String!]!
  tags: [Tag!]!
  sources: [Source!]!
  videoCount: Int!
  galleryCount: Int!
}

type PerformerAttributes {
  gender: String
  birthdate: String
  deathDate: String
  country: String
  ethnicity: String
  eyeColor: String
  hairColor: String
  heightCm: Int
  weightKg: Int
  measurements: String
  fakeTits: String
  tattoos: String
  piercings: String
  careerStart: Int
  careerEnd: Int
}

type Studio {
  id: ID!
  createdAt: String!
  updatedAt: String!
  name: String!
  aliases: [String!]!
  image: Asset
  details: String
  url: String
  parent: Studio
  tags: [Tag!]!
  sources: [Source!]!
  videoCount: Int!
  galleryCount: Int!
}

type Tag {
  id: ID!
  name: String!
  aliases: [String!]!
  videoCount: Int!
  galleryCount: Int!
}

type Source {
  id: ID!
  plugin: String!
  externalId: String!
  url: String!
  title: String
  image: Asset
  fetchedAt: String
}

type Stream {
  id: ID!
  url: String!
  mimeType: String!
  quality: String
  height: Int
  speedKbps: Int
  source: Source
}

type PluginPackage {
  name: String!
  version: String!
  description: String
  installedVersion: String
}

type Plugin {
  name: String!
  packageName: String
  localBuild: Boolean!
  displayName: String
  iconUrl: String
  description: String
  version: String!
  capabilities: [String!]!
  domains: [String!]!
  content: [String!]!
  enabled: Boolean!
  requiresSolver: Boolean!
  available: Boolean!
  settings: [PluginSettingField!]!
  settingValues: [PluginSettingValue!]!
}

type PluginSettingField {
  key: String!
  label: String!
  description: String
  type: String!
  required: Boolean!
  default: String
}

type PluginSettingValue {
  key: String!
  value: String!
}

input PluginSettingValueInput {
  key: String!
  value: String!
}