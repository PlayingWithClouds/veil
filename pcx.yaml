# pcx config — random-port launcher on top of process-compose.
# Run with:  pcx up   (see ../process-compose-random-port)
#
# Every name below is filled with a fresh free port each run and injected into
# the environment. process-compose.yaml and infra/docker-compose.yml reference
# them as ${VAR}, so nothing is hardcoded
# and this whole stack runs alongside other projects without port clashes.

composeFile: process-compose.yaml

ports:
  # App processes.
  - BACKEND_PORT
  - WEB_PORT
  # Infra (Docker Compose host ports; container-internal ports stay fixed).
  - FLARESOLVERR_PORT

# Browsable URLs.
urls:
  WEB_PORT: "http://localhost:${WEB_PORT}"
  BACKEND_PORT: "http://localhost:${BACKEND_PORT}"
