# The core content entity: a single adult video.

extend type Query {
  # Browse/discovery listing with advanced filters. The blocklist is applied.
  scenes(
    limit: Int
    offset: Int
    search: String
    studioId: ID
    performerId: ID
    # Matches the scene's own tags, its studio's tags, or any credited
    # performer's tags; direct matches rank first.
    tagId: ID
    sort: String
    minRating: Float
    minDuration: Int
    maxDuration: Int
    dateFrom: String
    dateTo: String
    # Only scenes found through these plugins; empty = any.
    sources: [String!]
    # Keep only scenes carrying every one of these tags (own, studio's or a
    # credited performer's).
    includeTagIds: [ID!]
    # Drop scenes carrying any of these tags (same inheritance).
    excludeTagIds: [ID!]
  ): [Scene!]!
  scene(id: ID!): Scene

  # A random selection of scenes, respecting the blocklist.
  randomScenes(limit: Int): [Scene!]!

  # The ranked personalized feed (see `recommendations` for the same list with
  # reasons). Newest scenes and recent search results on a cold start.
  recommendedFeed(limit: Int, offset: Int): [Scene!]!
}

type Scene {
  id: ID!
  externalId: String!
  sourceUrl: String!
  title: String!
  details: String
  # ISO 8601 release/publish date
  date: String
  durationSeconds: Int
  rating: Float
  viewCount: Int!
  organized: Boolean!
  posterPath: String
  previewVideo: String
  previewImages: [String!]!
  studio: Studio
  performers: [Performer!]!
  tags: [Tag!]!
  # "direct" | "inherited" — set when filtering by tagId; inherited means the
  # tag came from the scene's studio or a credited performer.
  tagMatch: String
  # "site" | "performer" | "tag" | "title" — set on scenes listed by `related`
  # and `relatedChanged`: the site's own related list, or the fallback search
  # (by a performer, a tag or the title) that linked it.
  relatedVia: String
  # Scenes related to this one, filled when the scene is visited: the site's own
  # related list first, then fallback searches by performer, tag and title.
  related(limit: Int): [Scene!]!
  # The comments under the video on its sites, as their pages showed them when
  # visited, each site in its own order.
  comments: [SceneComment!]!
  createdAt: String!
  updatedAt: String!
}

extend type Mutation {
  # Fetches the scene's page on its site again (credits, streams, related list
  # and comments) and returns its comments. For scenes visited before comments
  # were read, or to see newer ones.
  refreshSceneComments(sceneId: ID!): [SceneComment!]!
}

# One comment under a video on a site. Viewers often name the performer.
type SceneComment {
  # Unique within the scene: "<plugin>:<position>".
  id: ID!
  # The plugin whose site carries it.
  plugin: String!
  author: String
  text: String!
  # ISO 8601, approximate when the site only showed "3 weeks ago".
  postedAt: String
  likes: Int
  # id of the comment this one answers.
  replyTo: ID
  # Performers of the library the text names (full names of two words or
  # more), so a comment saying who it is links them.
  mentions: [Performer!]!
}
