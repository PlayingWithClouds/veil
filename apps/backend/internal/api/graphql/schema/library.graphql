# The core records: videos, galleries and images, performers, studios, tags,
# and where they came from. Types mirror schema/*.schema (bound to the
# generated Go types in internal/schema); references resolve to records.

extend type Query {
  # A page of videos matching filter (blocked and trashed ones never match),
  # in the filter's order; newest added first by default.
  videos(filter: FilterInput, limit: Int, offset: Int): [Video!]!
  videoCount(filter: FilterInput): Int!
  # The tags most common among the videos matching filter, most common
  # first; tags the filter already requires are left out.
  videoTagCounts(filter: FilterInput, limit: Int): [TagCount!]!
  video(id: ID!): Video
  galleries(filter: FilterInput, limit: Int, offset: Int): [Gallery!]!
  galleryCount(filter: FilterInput): Int!
  gallery(id: ID!): Gallery
  performers(text: String, limit: Int, offset: Int): [Performer!]!
  performer(id: ID!): Performer
  # Performers that are probably the same person: a name or alias in common.
  performerDuplicates(id: ID!): [Performer!]!
  # Every performer something is being fetched about right now.
  collecting: [Collecting!]!
  # The values a text attribute of PerformerAttributes ("hairColor") has
  # across the library's performers, most common first (default 50).
  performerAttributeValues(attribute: String!, limit: Int): [String!]!
  studios(text: String, limit: Int, offset: Int): [Studio!]!
  studio(id: ID!): Studio
  tags(text: String, limit: Int, offset: Int): [Tag!]!
  tag(id: ID!): Tag
}

extend type Mutation {
  # Reads the pages behind a video's sources that haven't been read yet
  # (credits, description, streams), then returns the video.
  fetchVideo(id: ID!): Video
  # Same for a gallery: its pages list the images.
  fetchGallery(id: ID!): Gallery
  # Same for a performer: reads their pages on the sites they came from
  # (bio, picture, attributes), then asks every site that can identify
  # performers for its profile of them (each site at most weekly). refresh
  # reads every page and asks every site again.
  fetchPerformer(id: ID!, refresh: Boolean): Performer
  # Takes a performer off a video they aren't in (locked, so the sites can't
  # put them back). When one of their site profiles credited them, that
  # profile is someone else's of the same name: it moves to a new performer,
  # returned, with the videos only it credited, and what it filled in is
  # read again from their other profiles. Null when no profile moved.
  unassignPerformer(videoId: ID!, performerId: ID!): Performer
  # Stores one page of a plugin's catalog (no query) or search results.
  browse(plugin: String!, kind: ListKind!, query: String, limit: Int, offset: Int): Listed!
  # Searches every plugin that lists this kind and stores the results, sites
  # taking turns. A site that answered within 6 hours isn't asked again.
  search(kind: ListKind!, query: String!, limit: Int): Listed!

  # The user's edits. Every field an edit sets is locked: later scrapes
  # leave it alone (see lockField).
  editVideo(id: ID!, edit: MediaEdit!): Video
  editGallery(id: ID!, edit: MediaEdit!): Gallery
  editPerformer(id: ID!, edit: PerformerEdit!): Performer
  editStudio(id: ID!, edit: StudioEdit!): Studio
  editTag(id: ID!, edit: TagEdit!): Tag
  # Locks a field to its current value, or unlocks it so the next source
  # that describes it takes it over. field is the field's name ("title").
  lockField(subject: RecordRefInput!, field: String!, locked: Boolean!): [FieldSource!]!
  # Puts a field back to its value before the revision, locked.
  revertRevision(id: ID!): Boolean!
}

extend type Subscription {
  # One page of a search (page 0 first, limit items per site, default 20)
  # across every site that lists this kind, or only the named plugins: each
  # site's results as they come, then the subscription completes. A site that
  # answered the same page within 6 hours isn't asked; its answer then is sent.
  # filter narrows the results sent (and its sites who's asked).
  searchResults(kind: ListKind!, query: String!, page: Int, limit: Int, plugins: [String!], filter: FilterInput): SearchBatch!
}

# Part of one site's answer to a search page.
type SearchBatch {
  plugin: String!
  listed: Listed!
  # How many sites this page asked.
  sites: Int!
  # From the site's answer within the last 6 hours, not asked now.
  stored: Boolean!
  # The site's last batch for this page.
  final: Boolean!
  # The site has no further pages for this search.
  exhausted: Boolean!
  # How many results the site gave in this batch, before the filter.
  returned: Int!
}

# A change to a video or gallery. Omitted fields stay; an empty string
# clears details, date or studio.
input MediaEdit {
  title: String
  details: String
  # YYYY-MM-DD
  date: String
  studioId: ID
  performerIds: [ID!]
  tagIds: [ID!]
  # wanted: known, not found yet (the wanted hunt searches for it).
  status: MediaStatus
  # Videos only.
  vr: VrFormatInput
  clearVr: Boolean
  width: Int
  height: Int
  # Videos and audio only.
  durationSeconds: Float
}

input PerformerEdit {
  name: String
  aliases: [String!]
  details: String
  links: [String!]
  # Replaces every attribute: ones left out are cleared. Attributes are one
  # field, so an edit locks them all against later scrapes.
  attributes: PerformerAttributesInput
  # The picture's URL; an empty string clears it.
  imageUrl: String
}

input PerformerAttributesInput {
  gender: String
  # YYYY-MM-DD
  birthdate: String
  deathDate: String
  country: String
  ethnicity: String
  eyeColor: String
  hairColor: String
  heightCm: Int
  weightKg: Int
  measurements: String
  fakeTits: String
  tattoos: String
  piercings: String
  careerStart: Int
  careerEnd: Int
}

input StudioEdit {
  name: String
  aliases: [String!]
  details: String
  url: String
  parentId: ID
}

input TagEdit {
  name: String
  aliases: [String!]
}

# Which source a field's value comes from.
type FieldSource {
  # The field's name, e.g. "title".
  field: String!
  writtenBy: Actor!
  # The source a plugin read it from; null for the user's own values.
  source: Source
  # The user set it; scrapes never change it.
  locked: Boolean!
  updatedAt: String!
}

# One change to one field of a record.
type Revision {
  id: ID!
  createdAt: String!
  subjectKind: RecordKind!
  subjectId: ID!
  field: String!
  before: JSON
  after: JSON
  writtenBy: Actor!
  # The plugin or automation that wrote it.
  actorName: String
}

# Who or what wrote a value.
enum Actor {
  user
  plugin
  automation
  system
}

# What a plugin can list.
enum ListKind {
  VIDEO
  GALLERY
  PERFORMER
  STUDIO
  TAG
}

# What a browse or search stored, by kind.
type TagCount {
  tag: Tag!
  count: Int!
}

type Listed {
  videos: [Video!]!
  galleries: [Gallery!]!
  performers: [Performer!]!
  studios: [Studio!]!
  tags: [Tag!]!
}

# A picture or clip: a stored blob or a remote URL.
type Asset {
  # blob://<key> for stored blobs, else the remote URL.
  uri: String!
  # Where to fetch it: the backend's blob URL, or the remote URL.
  url: String!
  mimeType: String
  width: Int
  height: Int
  blurhash: String
}

type Video {
  id: ID!
  createdAt: String!
  updatedAt: String!
  title: String!
  details: String
  date: String
  cover: Asset
  status: MediaStatus!
  studio: Studio
  performers: [Performer!]!
  tags: [Tag!]!
  durationSeconds: Float
  width: Int
  height: Int
  vr: VrFormat
  preview: Asset
  trickplay: Trickplay
  # Evenly spaced stills from the site's listing, in order.
  previewFrames: [Asset!]
  gallery: Gallery
  sources: [Source!]!
  # Playable streams, fastest measured first.
  streams: [Stream!]!
  userState: UserState!
  oCount: Int!
  fieldSources: [FieldSource!]!
  revisions(limit: Int, offset: Int): [Revision!]!
}

type VrFormat {
  projection: VrProjection!
  stereo: VrStereo!
  fieldOfView: Int
}

type Trickplay {
  sheets: [Asset!]!
  columns: Int!
  rows: Int!
  tileWidth: Int!
  tileHeight: Int!
  intervalSeconds: Float!
}

type Gallery {
  id: ID!
  createdAt: String!
  updatedAt: String!
  title: String!
  details: String
  date: String
  cover: Asset
  status: MediaStatus!
  studio: Studio
  performers: [Performer!]!
  tags: [Tag!]!
  imageCount: Int!
  images: [Image!]!
  video: Video
  sources: [Source!]!
  userState: UserState!
  oCount: Int!
  fieldSources: [FieldSource!]!
  revisions(limit: Int, offset: Int): [Revision!]!
}

type Image {
  id: ID!
  position: Int!
  asset: Asset!
  width: Int
  height: Int
}

type Performer {
  id: ID!
  createdAt: String!
  updatedAt: String!
  name: String!
  aliases: [String!]!
  image: Asset
  details: String
  attributes: PerformerAttributes!
  links: [String!]!
  tags: [Tag!]!
  sources: [Source!]!
  videoCount: Int!
  galleryCount: Int!
  userState: UserState!
  fieldSources: [FieldSource!]!
  revisions(limit: Int, offset: Int): [Revision!]!
  # What's being fetched about them right now.
  fetching: PerformerFetching!
}

# A performer something is being fetched about right now.
type Collecting {
  performer: Performer!
  # Their profiles are being read and the sites asked about them.
  reading: Boolean!
  # Plugins whose list of their videos is queued or running.
  listing: [String!]!
}

# What's being fetched about a performer right now.
type PerformerFetching {
  # Their profiles are being read and the sites asked about them (after
  # they were made a favourite).
  reading: Boolean!
  # Plugins whose list of their videos is queued or running.
  listing: [String!]!
}

type PerformerAttributes {
  gender: String
  birthdate: String
  deathDate: String
  country: String
  ethnicity: String
  eyeColor: String
  hairColor: String
  heightCm: Int
  weightKg: Int
  measurements: String
  fakeTits: String
  tattoos: String
  piercings: String
  careerStart: Int
  careerEnd: Int
}

type Studio {
  id: ID!
  createdAt: String!
  updatedAt: String!
  name: String!
  aliases: [String!]!
  image: Asset
  details: String
  url: String
  parent: Studio
  tags: [Tag!]!
  sources: [Source!]!
  videoCount: Int!
  galleryCount: Int!
  userState: UserState!
  fieldSources: [FieldSource!]!
  revisions(limit: Int, offset: Int): [Revision!]!
}

type Tag {
  id: ID!
  name: String!
  aliases: [String!]!
  videoCount: Int!
  galleryCount: Int!
  userState: UserState!
  revisions(limit: Int, offset: Int): [Revision!]!
}

# A site a record was found on.
type Source {
  id: ID!
  plugin: String!
  externalId: String!
  url: String!
  title: String
  image: Asset
  # When its page was read; null for a listing card only.
  fetchedAt: String
}

# A playable stream a source offers.
type Stream {
  id: ID!
  url: String!
  mimeType: String!
  quality: String
  height: Int
  speedKbps: Int
  source: Source
}
