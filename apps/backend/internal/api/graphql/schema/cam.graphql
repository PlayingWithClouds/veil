# Live webcam rooms. A room is not a scene: it comes and goes, so a cam model
# keeps what its site's listing last said and can be followed and shown offline.

extend type Query {
  # Rooms online right now across the cam plugins, in each site's popularity
  # order (sites merged by viewers). Listings go live to the plugins and are
  # cached for a minute so paging stays stable.
  camRooms(
    # Plugin names to list; all cam plugins when empty.
    sources: [String!]
    tag: String
    query: String
    # female | male | couple | trans
    gender: String
    limit: Int = 48
    offset: Int = 0
  ): CamRoomPage!
  camSources: [CamSource!]!
  # One cam model with its online status checked against the site.
  camModel(id: ID!): CamModel
  # Followed models, online ones first.
  followedCamModels: [CamModel!]!
  # The room's live HLS stream through the backend proxy (never cached on disk).
  camStream(id: ID!): CamStream!
}

extend type Mutation {
  followCamModel(id: ID!): CamModel!
  unfollowCamModel(id: ID!): CamModel!
}

type CamModel {
  id: ID!
  pluginName: String!
  username: String!
  displayName: String!
  sourceUrl: String!
  thumbnailUrl: String
  tags: [String!]!
  gender: String
  subject: String
  viewers: Int!
  online: Boolean!
  lastSeenOnlineAt: String
  followed: Boolean!
  # Recorded automatically whenever the model is live.
  autoRecord: Boolean!
  # What auto-record captures: source (the best rendition) or a height like 480;
  # the closest rendition at or below it, else the lowest above.
  recordQuality: String!
}

type CamRoomPage {
  rooms: [CamModel!]!
  totalCount: Int!
}

type CamSource {
  name: String!
  displayName: String!
  iconUrl: String
}

type CamStream {
  url: String!
  mimeType: String!
}

extend type Query {
  # Recordings of live rooms: the ones in progress (live duration and size),
  # then the finished ones, newest first. Filter by model or to active only.
  camRecordings(camModelId: ID, activeOnly: Boolean = false): [CamRecording!]!
}

extend type Mutation {
  # Start recording a room that is live now; returns the running recording if
  # the room is already being recorded. Recording runs in the backend until
  # stopped, the room goes offline or the maximum duration passes, then the
  # footage becomes a scene.
  # quality: source (default, the best rendition) or a target height like 480.
  startCamRecording(id: ID!, quality: String): CamRecording!
  # Stop the room's recording and wait for its scene; null when none was running.
  stopCamRecording(id: ID!): CamRecording
  # Record this model automatically whenever she is live (also follows).
  # quality: source or a target height; unchanged when omitted.
  setCamAutoRecord(id: ID!, enabled: Boolean!, quality: String): CamModel!
}

type CamRecording {
  id: ID!
  camModelId: ID!
  displayName: String!
  # The room's thumbnail, for avatars.
  thumbnailUrl: String
  # The rendition captured, like 720p.
  quality: String
  # recording | finished | failed
  status: String!
  # stopped | offline | max_duration | restart | too_short | error
  stopReason: String
  startedAt: String!
  endedAt: String
  durationSeconds: Float!
  sizeBytes: Float!
  # The scene created from a finished recording.
  sceneId: ID
}
