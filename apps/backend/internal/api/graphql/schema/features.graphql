# Features over the records: each answers with matches that say why they're
# there. Recommendations, related records and shorts come from the event
# log (see the event data shapes on recordEvent); lookups from plugins.

extend type Query {
  # Ranked recommendations of videos and galleries, each with its reasons.
  recommendations(limit: Int, offset: Int): [Match!]!
  # Records related to one: the linked gallery or video, the same
  # performers, studio, rare tags, similar frames.
  related(subject: RecordRefInput!, limit: Int): [Match!]!
  # The vertical feed: saved clips, segments, most-replayed moments and
  # short vertical videos.
  shorts(filter: FilterInput, limit: Int): [Short!]!
  # What the user likes and dislikes, from the event log.
  taste: Taste!
  # The video's most replayed second, else a segment's start.
  bestMoment(videoId: ID!): Float
}

extend type Mutation {
  # Asks every identification plugin about a text or picture (who is this,
  # which video is this). What they name is stored, so it's a mutation.
  lookup(input: LookupInput!): LookupResult!
}

# A record a feature found, with its score (0..1) and evidence.
type Match {
  item: RecordRef!
  record: Record
  score: Float
  evidence: [Evidence!]!
}

# Why a match is there.
type Evidence {
  # Plugin name, or "veil" for the backend's own features.
  plugin: String!
  url: String
  title: String
  image: Asset
  # e.g. "Because you watched …", "94% face match", "accepted answer".
  detail: String
}

# One item of the shorts feed: where in which video to start.
type Short {
  match: Match!
  video: Video
  startSeconds: Float
  endSeconds: Float
}

type Taste {
  # How many signals the profile rests on.
  signalCount: Int!
  tags: [TasteEntry!]!
  performers: [TasteEntry!]!
  studios: [TasteEntry!]!
  sites: [TasteEntry!]!
}

# One liked (weight > 0) or disliked (< 0) tag, performer, studio or site.
type TasteEntry {
  id: ID!
  name: String!
  image: Asset
  weight: Float!
}

input LookupInput {
  text: String
  # The picture, base64.
  imageBase64: String
  mimeType: String
  # Only these plugins (all when omitted).
  plugins: [String!]
}

type LookupResult {
  matches: [Match!]!
  # The plugins that failed, with why.
  failures: [String!]!
}

extend type Video {
  related(limit: Int): [Match!]!
}

extend type Gallery {
  related(limit: Int): [Match!]!
}
