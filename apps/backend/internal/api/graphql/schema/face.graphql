# "Who is this?": performers who look like the person in a picture, from the
# face-recognition plugins. Their databases hold professional performers and
# cam models only; the user's choice credits a performer to the media.

extend type Mutation {
  # Sends the picture of a scene (its thumbnail or poster), of an image, or of a
  # gallery (imageId, else its first image) to every face-recognition plugin and
  # returns the merged candidates, best first. frameBase64 (a JPEG or PNG, e.g.
  # the video frame the user paused on) is sent instead when given; mediaId is
  # then only the media the pick gets credited to.
  identifyFace(mediaId: ID!, imageId: ID, frameBase64: String): FaceIdentification!
  # Face search for a picture of the user's own, tied to no media: pictureBase64
  # (a JPEG, PNG, WebP or GIF) or else pictureUrl (an http(s) image address,
  # loaded through the image cache). Nothing can be credited from the answer.
  identifyPicture(pictureBase64: String, pictureUrl: String): FaceIdentification!
  # Credits the performer called name to a scene or gallery (an image counts for
  # its gallery), creating the performer when the library has none. The name is
  # matched like ingest does (spelling-insensitive, aliases).
  creditPerformerByName(mediaId: ID!, name: String!): Performer!
}

type FaceIdentification {
  candidates: [FaceCandidate!]!
  # Videos on tube sites with a similar face, best first. They name nobody and
  # cannot be credited; the dialog shows them as links.
  videos: [FaceVideoMatch!]!
  # Posts on identification forums (NameThatPorn) whose picture looks like the
  # searched one, in the sites' order.
  posts: [FacePostMatch!]!
  # The performers the posts' accepted answers name, most often named first.
  postPerformers: [FacePostPerformer!]!
  # Plugins that answered.
  sources: [String!]!
  # One line per plugin that failed or timed out.
  failures: [String!]!
  # The stored picture that was sent (scene thumbnail or poster, gallery image);
  # null when frameBase64 was.
  pictureUrl: String
}

type FaceVideoMatch {
  # The video's own title.
  title: String!
  # 0..1, the best any service gave.
  similarity: Float!
  # The video's page.
  url: String!
  thumbnailUrl: String
  # Plugins that found this video.
  sources: [String!]!
  # The scene plugin that serves the page: pass it with url to
  # resolvePluginResult to open the video as a scene. Null when none does.
  scenePlugin: String
}

type FacePostMatch {
  # The asker's title.
  title: String!
  # The post's page.
  url: String!
  thumbnailUrl: String
  # Whether the post has an accepted answer.
  solved: Boolean!
  # Stage names the accepted answer gives; empty while unsolved.
  names: [String!]!
  # Plugins that found this post.
  sources: [String!]!
}

type FacePostPerformer {
  # The stage name.
  name: String!
  # How many of the matching posts name this performer.
  posts: Int!
  # The thumbnail of the best post naming the performer.
  imageUrl: String
  # The best post naming the performer.
  postUrl: String!
  # The library's performer of that name, when there is one.
  performerId: ID
}

type FaceCandidate {
  # The performer's stage name.
  name: String!
  # 0..1, the best any service gave.
  similarity: Float!
  imageUrl: String
  # The performer's pages on adult sites.
  profileUrls: [String!]!
  # Plugins that named this candidate.
  sources: [String!]!
  # The library's performer of that name, when there is one.
  performerId: ID
}

extend type Query {
  # One thread of a porn identification forum (a post face search found), read
  # live through the plugin serving url: the question and its comments, each
  # link marked with the scene plugin that can play it.
  forumThread(url: String!): ForumThread!
  # Threads of identification forums (NameThatPorn) whose text matches query,
  # read live from every forum plugin; each plugin's best first, at most limit
  # (default 12) per plugin. A forum that fails is left out.
  forumSearch(query: String!, limit: Int): [ForumPostHit!]!
}

type ForumPostHit {
  title: String!
  # The thread's page; open it with forumThread.
  url: String!
  thumbnailUrl: String
  # ISO 8601.
  date: String
  solved: Boolean!
  author: String
  # The start of the question or answer, as the forum's search shows it.
  snippet: String
  # The plugin that found it.
  plugin: String!
}

type ForumThread {
  url: String!
  title: String!
  description: String
  # The asked-about picture; null for a video post without one.
  imageUrl: String
  # The asked-about clip, when the post is a video or GIF.
  videoUrl: String
  author: String
  # ISO 8601.
  date: String
  tags: [String!]!
  solved: Boolean!
  # The plugin that read the thread.
  plugin: String!
  # In the site's order, the accepted answer marked.
  comments: [ForumComment!]!
}

type ForumComment {
  id: String!
  author: String
  # ISO 8601.
  date: String
  # Plain text, line breaks kept.
  text: String!
  accepted: Boolean!
  likes: Int
  names: [ForumName!]!
  # Scene or movie titles the comment tags.
  titles: [String!]!
  links: [ForumLink!]!
  # Pictures posted in the comment.
  images: [String!]!
  # Other threads of the same forum the comment points to.
  posts: [ForumPostRef!]!
}

type ForumPostRef {
  title: String!
  # The thread's page; open it with forumThread.
  url: String!
  thumbnailUrl: String
}

type ForumName {
  name: String!
  # The library's performer of that name, when there is one.
  performerId: ID
}

type ForumLink {
  url: String!
  # The scene plugin that serves the page: pass it with url to
  # resolvePluginResult to watch the video in the app. Null when none does.
  scenePlugin: String
}
