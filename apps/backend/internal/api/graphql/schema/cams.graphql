# Live cam rooms, linked to performers, and their recordings (which become
# ordinary videos with recordedFrom set).

extend type Query {
  # Rooms online now on every cam site (or some), most viewers first unless
  # the query sorts otherwise. Blocked rooms are left out.
  camRooms(query: CamQuery): CamRoomPage!
  # Rooms live now ranked by what the user likes: their tags and linked
  # performers. Followed, auto-recorded and blocked rooms are left out.
  camRecommendations(limit: Int): [CamModel!]!
  # Stored rooms, live first.
  camModels(live: Boolean, autoRecord: Boolean, performerId: ID, limit: Int, offset: Int): [CamModel!]!
  camModel(id: ID!): CamModel
  # Recordings running now.
  activeRecordings: [ActiveRecording!]!
}

extend type Mutation {
  # A playable live URL for a room (with rewind through the live buffer).
  watchCam(id: ID!): Playable!
  # quality: "best", "720p", …
  setCamAutoRecord(id: ID!, on: Boolean!, quality: String): CamModel!
  # Links the room to a library performer; null unlinks.
  linkCamPerformer(id: ID!, performerId: ID): CamModel!
  # Records a room, optionally starting fromSecondsAgo in the live buffer.
  startRecording(id: ID!, quality: String, fromSecondsAgo: Int): Job!
  # Stops and files the recording as a video.
  stopRecording(id: ID!): Boolean!
}

input CamQuery {
  plugins: [String!]
  text: String
  tag: String
  # female, male, couple, trans
  gender: String
  sort: CamSort
  limit: Int
  offset: Int
}

enum CamSort {
  # Most viewers first.
  viewers
  # Fewest viewers first.
  fewest
  # The shows that began last first, among each site's 500 most watched rooms.
  started
}

type CamRoomPage {
  rooms: [CamModel!]!
  total: Int!
}

# A room on one cam site.
type CamModel {
  id: ID!
  plugin: String!
  username: String!
  displayName: String!
  performer: Performer
  thumbnail: Asset
  tags: [String!]!
  gender: String
  # Null when offline.
  live: CamLive
  lastSeenOnlineAt: String
  autoRecord: Boolean!
  recordQuality: String
  # Its recordings, newest first.
  recordings: [Video!]!
  # Its shows of the last eight weeks that were seen ending, newest first.
  shows: [CamShow!]!
  userState: UserState!
}

# One show of a room, from its start to when it was last seen live.
type CamShow {
  startedAt: String!
  endedAt: String!
}

type CamLive {
  viewers: Int!
  subject: String
  startedAt: String
  thumbnail: Asset
}

type ActiveRecording {
  job: Job
  camModel: CamModel
  startedAt: String!
  durationSeconds: Float!
  sizeBytes: Int!
  quality: String
}

extend type Video {
  # The cam room it was recorded from.
  recordedFrom: CamModel
  # The cam rooms of the person in it, live state checked now: the room it
  # was recorded from, rooms linked to its performers, and rooms its title
  # names by username along with their site (as cam show archives do).
  camRooms: [CamModel!]!
}
