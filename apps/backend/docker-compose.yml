services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    network_mode: host
    volumes:
      - .:/app
      - ../veil-sdk:/app/veil-sdk
      - go_mod_cache:/root/go/pkg/mod
      - veil_data:/data
    environment:
      - DATA_DIR=/data
      - PLUGIN_DIR=/app/plugins
      - PORT=8080
      - FLARESOLVERR_URL=http://127.0.0.1:8191/v1
    restart: unless-stopped

  # Cloudflare challenge solver for source sites (e.g. missav search) whose
  # routes a plain fetch cannot reach. Plugins fall back to it on a 403.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    network_mode: host
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  frontend:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INTERNAL_API_URL=http://host.docker.internal:8080
      - PUBLIC_API_URL=http://localhost:8080
    # Install deps if needed, then start the Vite dev server.
    command: sh -c "bun install && exec bun run dev --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  veil_data:
  web_node_modules:
  go_mod_cache:
