<!DOCTYPE html><html><body>
					<form method="POST" action="https://chyoa.com/auth/login" accept-charset="UTF-8" class="rd-auth-form tw-grid tw-gap-4"><input name="_token" type="hidden" value="CSRF_TOKEN_PLACEHOLDER">
	<div class="rd-auth-field tw-grid tw-gap-2">
		<label for="auth_username" class="rd-auth-label tw-m-0 tw-text-15 tw-font-semibold tw-leading-5">Username</label>
		<input id="auth_username" class="rd-auth-form-control tw-w-full tw-rounded-md tw-text-16 sm:tw-text-15 focus:tw-outline-none" autocomplete="username" required="required" name="username" type="text">
			</div>

	<div class="rd-auth-field tw-grid tw-gap-2">
		<label for="auth_password" class="rd-auth-label tw-m-0 tw-text-15 tw-font-semibold tw-leading-5">Password</label>
		<input id="auth_password" class="rd-auth-form-control tw-w-full tw-rounded-md tw-text-16 sm:tw-text-15 focus:tw-outline-none" autocomplete="current-password" required="required" name="password" type="password" value="">
			</div>

	<div class="rd-auth-options-row tw-mt-2 tw-flex tw-flex-row tw-justify-between tw-gap-3">
		<label class="rd-auth-checkbox tw-flex tw-items-start tw-gap-2" for="auth_remember_me">
	<span class="rd-auth-checkbox__control">
		<input id="auth_remember_me" class="rd-auth-checkbox__input" checked="checked" name="remember" type="checkbox" value="1">
	</span>
	<span class="rd-auth-checkbox__label tw-block tw-text-16 tw-font-medium tw-leading-6 sm:tw-text-15 sm:tw-leading-5">Remember me</span>
</label>
		<a href="https://chyoa.com/iforgot/password" class="rd-auth-link tw-shrink-0 tw-whitespace-nowrap tw-text-16 tw-font-semibold tw-leading-6 sm:tw-text-15 sm:tw-leading-5">Forgot password?</a>
	</div>

	<button type="submit" class="rd-auth-button rd-auth-button--primary tw-inline-flex tw-min-h-10 tw-w-full tw-items-center tw-justify-center tw-rounded-md tw-border-0 tw-px-3 tw-py-2 tw-text-16 tw-font-semibold sm:tw-text-15 focus:tw-outline-none">
		Log in
	</button>
</form>
				</div>
				
								<p class="rd-auth-panel-footer tw-m-0 tw-mt-5 tw-text-16 tw-leading-6 tw-text-[rgb(var(--chyoa-home-muted))] sm:tw-text-15 tw-hidden lg:tw-block">
</body></html>
