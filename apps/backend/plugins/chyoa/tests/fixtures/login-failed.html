<!DOCTYPE html><html><body>
<!-- Hand-written: the page the login form comes back to after a refused login. The error markup is a guess from the site's stylesheet (rd-auth-field-error), not a recording. -->
<form method="POST" action="https://chyoa.com/auth/login" accept-charset="UTF-8" class="rd-auth-form"><input name="_token" type="hidden" value="CSRF_TOKEN_PLACEHOLDER">
  <div class="rd-auth-field">
    <input id="auth_username" name="username" type="text" value="someone">
    <p class="rd-auth-field-error">These credentials do not match our records.</p>
  </div>
  <div class="rd-auth-field"><input id="auth_password" name="password" type="password" value=""></div>
</form>
</body></html>
