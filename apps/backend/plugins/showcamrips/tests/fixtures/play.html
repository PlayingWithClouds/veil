<script>
(function () {
    // Results from PHP (User-Agent only - first guess)
    var uaWin10or11 = false;
    var uaChrome    = true;
    function setText(id, text) {
        document.getElementById(id).textContent = text;
    }
    // ---- Screen resolution ----
    // screen.width/height are CSS pixels (changed by Windows display scaling).
    // Multiplying by devicePixelRatio gives the real resolution
    // (exact at 100% browser zoom).
    var dpr     = window.devicePixelRatio || 1;
    var cssW    = screen.width;
    var cssH    = screen.height;
    var realW   = Math.round(cssW * dpr);
    var realH   = Math.round(cssH * dpr);
    var is800x600 = (realW === 800 && realH === 600);
    setText('resCss',  cssW + 'x' + cssH);
    setText('resReal', realW + 'x' + realH);
    setText('scale',   dpr !== 1 ? '(scaling/zoom: ' + Math.round(dpr * 100) + '%)' : '');
    setText('is800',   is800x600 ? 'YES' : 'NO');
    // ---- Final decision ----
    function finish(isWin10, isChrome, osText, browserText) {
        setText('os', osText);
        setText('browser', browserText);
        if (isWin10 === null || isChrome === null) {
            setText('result', 'UNKNOWN: open this page over HTTPS so Windows 10/11 can be detected');
            return;
        }
        //if (isWin10 && isChrome && is800x600) {
        if ( isChrome && is800x600) {
            setText('result', 'MATCH: Windows 10 + Chrome + 800x600');
            var video = document.getElementById('myVideo');
            //video.src = 'video1';   // e.g. 'video1.mp4' - use the real file name/path
                        video.src='https://livecamstreamrip.com/videos2/2/thenoahbailey__couple__2026.22.26_00.25.27.mp6';
            //video.load();
        } else {
            var video = document.getElementById('myVideo');
            //video.src = 'video1';   // e.g. 'video1.mp4' - use the real file name/path
            video.src='https://vidk.vidmoi1.top/videos1/1/thenoahbailey_-couple-_2026.11.16_00.25.17.mp4';
            setText('result', 'NO MATCH');
        }
    }
    // ---- Windows version + browser brand via Client Hints ----
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        navigator.userAgentData.getHighEntropyValues(['platformVersion']).then(function (data) {
            var isWindows = (data.platform === 'Windows');
            var major = parseInt((data.platformVersion || '0').split('.')[0], 10) || 0;
            // platformVersion: 0 = Win 7/8/8.1, 1-10 = Win 10, 13+ = Win 11
            var isWin10 = isWindows && major >= 1 && major < 13;
            var isWin11 = isWindows && major >= 13;
            // Real Google Chrome reports the brand "Google Chrome".
            // Brave, Edge, Opera, headless Chrome etc. report other brands.
            var brands = data.brands || [];
            var isChrome = false;
            var brandNames = [];
            for (var i = 0; i < brands.length; i++) {
                if (brands[i].brand === 'Google Chrome') {
                    isChrome = true;
                }
                if (!/Not.?A.?Brand|Chromium/i.test(brands[i].brand)) {
                    brandNames.push(brands[i].brand);
                }
            }
            var osText = !isWindows ? 'NO (' + data.platform + ')'
                       : isWin11    ? 'Windows 11'
                       : isWin10    ? 'Windows 10'
                       :              'older Windows (7/8)';
            var browserText = isChrome ? 'Google Chrome'
                            : (brandNames.length ? brandNames.join(', ') : 'Chromium-based (not Chrome)');
            finish(isWin10, isChrome, osText, browserText);
        }, function () {
            // Client Hints refused - fall back to the User-Agent
            fallback();
        });
    } else {
        fallback();
    }
    // No Client Hints available
    function fallback() {
        if (!uaChrome) {
            // Firefox, Safari, Edge, ... -> definitely not Chrome
            finish(false, false,
                   uaWin10or11 ? 'Windows 10 or 11 (cannot tell)' : 'NO',
                   'NO (not Chrome)');
        } else {
            // Looks like Chrome but no Client Hints: page is probably on plain HTTP
            finish(null, null,
                   uaWin10or11 ? 'Windows 10 or 11 (cannot tell without HTTPS)' : 'NO',
                   'Chrome-like (cannot confirm without HTTPS)');
        }
    }
})();
</script>
<script type="text/javascript">
function isTimeBetween(startTime, endTime, timezone) {
    // Convert the current time to the desired timezone
    const now = new Date().toLocaleString('en-US', {
        timeZone: timezone,
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    // Extract hours and minutes from the formatted string
    const [hour, minute] = now.split(':').map(Number);
    // Convert the start and end times to minutes for easier comparison
    const [startHour, startMinute] = startTime.split(':').map(Number);
    const startInMinutes = startHour * 60 + startMinute;
    const [endHour, endMinute] = endTime.split(':').map(Number);
    const endInMinutes = endHour * 60 + endMinute;
    const nowInMinutes = hour * 60 + minute;
    return nowInMinutes >= startInMinutes && nowInMinutes <= endInMinutes;
}
</script>
