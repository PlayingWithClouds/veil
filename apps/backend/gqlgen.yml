schema:
  - internal/api/graphql/schema/*.graphql

exec:
  filename: internal/api/graphql/generated/generated.go
  package: generated

model:
  filename: internal/api/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/api/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

models:
  # Resolve the watched scene lazily, only when the query requests it — the
  # progress store pulls hundreds of history rows without needing scene detail.
  WatchHistory:
    fields:
      scene:
        resolver: true
  # A job's scene loads only when asked (the library's download cards).
  Job:
    fields:
      scene:
        resolver: true
  # Related scenes load lazily, only when a query asks for them.
  Scene:
    fields:
      related:
        resolver: true
  # Lists and pages count scenes up front; nested references (a scene's
  # performers and studio) count only when a query asks.
  Performer:
    fields:
      sceneCount:
        resolver: true
  Studio:
    fields:
      sceneCount:
        resolver: true
  # A gallery's linked video loads only when asked (the gallery page).
  Gallery:
    fields:
      video:
        resolver: true
  SearchSubscription:
    fields:
      scenes:
        resolver: true
      newCount:
        resolver: true
      totalCount:
        resolver: true
