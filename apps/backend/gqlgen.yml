schema:
  - internal/api/graphql/schema/*.graphql

exec:
  filename: internal/api/graphql/generated/generated.go
  package: generated

model:
  filename: internal/api/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/api/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

# Library types are the generated schema types (schema/*.schema →
# internal/schema). Fields that hold a reference id there resolve to the
# record here.
models:
  SitePreference:
    model: github.com/playingwithclouds/veil/internal/user.SitePreference
  Video:
    model: github.com/playingwithclouds/veil/internal/schema.Video
    fields:
      studio:
        resolver: true
      performers:
        resolver: true
      tags:
        resolver: true
      gallery:
        resolver: true
      recordedFrom:
        resolver: true
  Gallery:
    model: github.com/playingwithclouds/veil/internal/schema.Gallery
    fields:
      studio:
        resolver: true
      performers:
        resolver: true
      tags:
        resolver: true
      video:
        resolver: true
  Image:
    model: github.com/playingwithclouds/veil/internal/schema.Image
  Performer:
    model: github.com/playingwithclouds/veil/internal/schema.Performer
    fields:
      tags:
        resolver: true
  PerformerAttributes:
    model: github.com/playingwithclouds/veil/internal/schema.PerformerAttributes
  PerformerAttributesInput:
    model: github.com/playingwithclouds/veil/internal/schema.PerformerAttributes
  Studio:
    model: github.com/playingwithclouds/veil/internal/schema.Studio
    fields:
      parent:
        resolver: true
      tags:
        resolver: true
  Tag:
    model: github.com/playingwithclouds/veil/internal/schema.Tag
  Source:
    model: github.com/playingwithclouds/veil/internal/schema.Source
  Stream:
    model: github.com/playingwithclouds/veil/internal/schema.Stream
    fields:
      source:
        resolver: true
  Asset:
    model: github.com/playingwithclouds/veil/internal/schema.Asset
    fields:
      url:
        resolver: true
  VrFormat:
    model: github.com/playingwithclouds/veil/internal/schema.VrFormat
  VrFormatInput:
    model: github.com/playingwithclouds/veil/internal/schema.VrFormat
  VrProjection:
    model: github.com/playingwithclouds/veil/internal/schema.VrProjection
  VrStereo:
    model: github.com/playingwithclouds/veil/internal/schema.VrStereo
  Trickplay:
    model: github.com/playingwithclouds/veil/internal/schema.Trickplay
  # Float also carries the schema's f32 fields (ratings).
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.Float
      - github.com/playingwithclouds/veil/internal/api/graphql/scalars.Float32
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
  # Enums are the schema's own, values spelled as there.
  RecordKind:
    model: github.com/playingwithclouds/veil/internal/schema.RecordKind
  MediaKind:
    model: github.com/playingwithclouds/veil/internal/schema.MediaKind
  MediaStatus:
    model: github.com/playingwithclouds/veil/internal/schema.MediaStatus
  Actor:
    model: github.com/playingwithclouds/veil/internal/schema.Actor
  EventKind:
    model: github.com/playingwithclouds/veil/internal/schema.EventKind
  SortField:
    model: github.com/playingwithclouds/veil/internal/schema.SortField
  JobKind:
    model: github.com/playingwithclouds/veil/internal/schema.JobKind
  JobStatus:
    model: github.com/playingwithclouds/veil/internal/schema.JobStatus
  Platform:
    model: github.com/playingwithclouds/veil/internal/schema.Platform
  StorageKind:
    model: github.com/playingwithclouds/veil/internal/schema.StorageKind
  RecordRef:
    model: github.com/playingwithclouds/veil/internal/schema.RecordRef
  RecordRefInput:
    model: github.com/playingwithclouds/veil/internal/schema.RecordRef
  Record:
    model: github.com/playingwithclouds/veil/internal/api/graphql/model.Record
  UserState:
    model: github.com/playingwithclouds/veil/internal/schema.UserState
    fields:
      record:
        resolver: true
  Event:
    model: github.com/playingwithclouds/veil/internal/schema.Event
  Filter:
    model: github.com/playingwithclouds/veil/internal/schema.Filter
  FilterInput:
    model: github.com/playingwithclouds/veil/internal/schema.Filter
  Sort:
    model: github.com/playingwithclouds/veil/internal/schema.Sort
  SortInput:
    model: github.com/playingwithclouds/veil/internal/schema.Sort
  FieldCondition:
    model: github.com/playingwithclouds/veil/internal/schema.FieldCondition
  FieldConditionInput:
    model: github.com/playingwithclouds/veil/internal/schema.FieldCondition
  SavedFilter:
    model: github.com/playingwithclouds/veil/internal/schema.SavedFilter
  FieldSource:
    model: github.com/playingwithclouds/veil/internal/schema.FieldSource
    fields:
      field:
        resolver: true
      source:
        resolver: true
  Revision:
    model: github.com/playingwithclouds/veil/internal/schema.Revision
    fields:
      field:
        resolver: true
  Job:
    model: github.com/playingwithclouds/veil/internal/jobs.Job
    fields:
      createdAt:
        resolver: true
      runAt:
        resolver: true
      startedAt:
        resolver: true
      finishedAt:
        resolver: true
      device:
        resolver: true
      error:
        resolver: true
  Device:
    model: github.com/playingwithclouds/veil/internal/schema.Device
  StorageLocation:
    model: github.com/playingwithclouds/veil/internal/schema.StorageLocation
    fields:
      device:
        resolver: true
  # Media beyond videos and galleries, and site groups.
  Audio:
    model: github.com/playingwithclouds/veil/internal/schema.Audio
    fields:
      studio:
        resolver: true
      performers:
        resolver: true
      tags:
        resolver: true
  Story:
    model: github.com/playingwithclouds/veil/internal/schema.Story
    fields:
      studio:
        resolver: true
      performers:
        resolver: true
      tags:
        resolver: true
  StoryChapter:
    model: github.com/playingwithclouds/veil/internal/schema.StoryChapter
  Post:
    model: github.com/playingwithclouds/veil/internal/schema.Post
    fields:
      creator:
        resolver: true
      tags:
        resolver: true
      attachments:
        resolver: true
  Group:
    model: github.com/playingwithclouds/veil/internal/schema.Group
    fields:
      studio:
        resolver: true
  # Curation.
  Category:
    model: github.com/playingwithclouds/veil/internal/schema.Category
    fields:
      parent:
        resolver: true
      matchTags:
        resolver: true
  Collection:
    model: github.com/playingwithclouds/veil/internal/schema.Collection
  CollectionKind:
    model: github.com/playingwithclouds/veil/internal/schema.CollectionKind
  CollectionItem:
    model: github.com/playingwithclouds/veil/internal/schema.CollectionItem
    fields:
      record:
        resolver: true
      addedAt:
        resolver: true
  FieldDef:
    model: github.com/playingwithclouds/veil/internal/schema.FieldDef
  FieldDefInput:
    model: github.com/playingwithclouds/veil/internal/schema.FieldDef
  FieldType:
    model: github.com/playingwithclouds/veil/internal/schema.FieldType
  # Playback extras.
  Segment:
    model: github.com/playingwithclouds/veil/internal/schema.Segment
    fields:
      tag:
        resolver: true
      performers:
        resolver: true
  SegmentOrigin:
    model: github.com/playingwithclouds/veil/internal/schema.SegmentOrigin
  Clip:
    model: github.com/playingwithclouds/veil/internal/schema.Clip
    fields:
      video:
        resolver: true
      file:
        resolver: true
  Subtitle:
    model: github.com/playingwithclouds/veil/internal/schema.Subtitle
  SubtitleOrigin:
    model: github.com/playingwithclouds/veil/internal/schema.SubtitleOrigin
  Script:
    model: github.com/playingwithclouds/veil/internal/schema.Script
  ScriptKind:
    model: github.com/playingwithclouds/veil/internal/schema.ScriptKind
  Comment:
    model: github.com/playingwithclouds/veil/internal/schema.Comment
    fields:
      source:
        resolver: true
      mentions:
        resolver: true
  # Files, duplicates, fingerprints, embeddings.
  AlikePair:
    model: github.com/playingwithclouds/veil/internal/schema.Alike
    fields:
      first:
        resolver: true
      second:
        resolver: true
      provablySame:
        resolver: true
  LibraryRoot:
    model: github.com/playingwithclouds/veil/internal/schema.LibraryRoot
    fields:
      location:
        resolver: true
  MediaFile:
    model: github.com/playingwithclouds/veil/internal/schema.MediaFile
    fields:
      url:
        resolver: true
      location:
        resolver: true
  Fingerprint:
    model: github.com/playingwithclouds/veil/internal/schema.Fingerprint
  FingerprintAlgorithm:
    model: github.com/playingwithclouds/veil/internal/schema.FingerprintAlgorithm
  Embedding:
    model: github.com/playingwithclouds/veil/internal/schema.Embedding
  EmbeddingKind:
    model: github.com/playingwithclouds/veil/internal/schema.EmbeddingKind
  # Features.
  Match:
    model: github.com/playingwithclouds/veil/internal/schema.Match
    fields:
      record:
        resolver: true
  Evidence:
    model: github.com/playingwithclouds/veil/internal/schema.Evidence
  Short:
    model: github.com/playingwithclouds/veil/internal/recommend.Short
    fields:
      video:
        resolver: true
  Taste:
    model: github.com/playingwithclouds/veil/internal/recommend.Taste
  TasteEntry:
    model: github.com/playingwithclouds/veil/internal/recommend.TasteEntry
  # Following, notifications, limits, automations.
  Follow:
    model: github.com/playingwithclouds/veil/internal/schema.Follow
    fields:
      target:
        resolver: true
  Notification:
    model: github.com/playingwithclouds/veil/internal/schema.Notification
    fields:
      record:
        resolver: true
  NotificationChannel:
    model: github.com/playingwithclouds/veil/internal/schema.NotificationChannel
    fields:
      delivers:
        resolver: true
  ChannelKind:
    model: github.com/playingwithclouds/veil/internal/schema.ChannelKind
  Limit:
    model: github.com/playingwithclouds/veil/internal/schema.Limit
  LimitKind:
    model: github.com/playingwithclouds/veil/internal/schema.LimitKind
  LimitWindow:
    model: github.com/playingwithclouds/veil/internal/schema.LimitWindow
  LimitAction:
    model: github.com/playingwithclouds/veil/internal/schema.LimitAction
  LimitStatus:
    model: github.com/playingwithclouds/veil/internal/limits.LimitStatus
  Usage:
    model: github.com/playingwithclouds/veil/internal/limits.Usage
    fields:
      since:
        resolver: true
      until:
        resolver: true
  TriggerKind:
    model: github.com/playingwithclouds/veil/internal/schema.TriggerKind
  Trigger:
    model: github.com/playingwithclouds/veil/internal/schema.Trigger
  TriggerInput:
    model: github.com/playingwithclouds/veil/internal/schema.Trigger
  Step:
    model: github.com/playingwithclouds/veil/internal/schema.Step
  StepInput:
    model: github.com/playingwithclouds/veil/internal/schema.Step
  StepResult:
    model: github.com/playingwithclouds/veil/internal/schema.StepResult
  Automation:
    model: github.com/playingwithclouds/veil/internal/schema.Automation
  AutomationRun:
    model: github.com/playingwithclouds/veil/internal/schema.AutomationRun
    fields:
      automation:
        resolver: true
  RunStatus:
    model: github.com/playingwithclouds/veil/internal/schema.RunStatus
  # Cams.
  CamModel:
    model: github.com/playingwithclouds/veil/internal/schema.CamModel
    fields:
      performer:
        resolver: true
  CamLive:
    model: github.com/playingwithclouds/veil/internal/schema.CamLive
  ActiveRecording:
    model: github.com/playingwithclouds/veil/internal/cams.ActiveRecording
    fields:
      job:
        resolver: true
      camModel:
        resolver: true
      startedAt:
        resolver: true
  # Platform.
  ApiToken:
    model: github.com/playingwithclouds/veil/internal/schema.ApiToken
  Account:
    model: github.com/playingwithclouds/veil/internal/schema.Account
  AccountStatus:
    model: github.com/playingwithclouds/veil/internal/schema.AccountStatus
  Plugin:
    fields:
      contributions:
        resolver: true
      account:
        resolver: true
