# Categories, taste and plugins, as the web's categories.ts, taste.ts and plugins.ts read them.

# Every category with how many videos it holds and a picture, in their order.
query CategoryTiles {
  categoryTiles(kind: video) {
    count
    preview {
      url
    }
    category {
      id
      name
      parent {
        id
      }
    }
  }
}

fragment TasteEntryFields on TasteEntry {
  id
  name
  weight
  confirmed
  image {
    url
  }
}

query Taste {
  taste {
    signalCount
    sceneLabels {
      tag {
        id
        name
      }
      score
      certainty
      evidence
      confirmed
      videoCount
    }
    tags {
      ...TasteEntryFields
    }
    performers {
      ...TasteEntryFields
    }
    studios {
      ...TasteEntryFields
    }
    sites {
      ...TasteEntryFields
    }
  }
}

query InstalledPlugins {
  plugins {
    name
    displayName
    iconUrl
    description
    version
    enabled
    available
  }
}

query PluginPackages {
  pluginPackages {
    name
    version
    description
    installedVersion
  }
}

mutation SetPluginEnabled($name: String!, $enabled: Boolean!) {
  setPluginEnabled(name: $name, enabled: $enabled)
}

mutation InstallPlugin($packageName: String!) {
  installPlugin(packageName: $packageName)
}

mutation UpdatePlugins {
  updatePlugins
}
