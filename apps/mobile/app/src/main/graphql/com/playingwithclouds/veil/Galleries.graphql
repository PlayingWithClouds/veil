fragment GalleryDetailFields on Gallery {
  id
  title
  details
  date
  coverPath
  imageCount
  tags {
    id
    name
  }
  images {
    id
    filePath
    title
    width
    height
    position
  }
  video {
    id
    title
  }
}

query GalleryDetail($id: ID!) {
  gallery(id: $id) {
    ...GalleryDetailFields
  }
}

mutation EnsureGalleryImages($galleryId: ID!) {
  ensureGalleryImages(galleryId: $galleryId) {
    ...GalleryDetailFields
  }
}

query PluginCategories($plugin: String!, $limit: Int) {
  pluginCategories(plugin: $plugin, limit: $limit) {
    id
    name
    poster
  }
}

query FindGalleryVideos($galleryId: ID!, $limit: Int) {
  findGalleryVideos(galleryId: $galleryId, limit: $limit) {
    externalId
    title
    plugin
    sourceUrl
    posterUrl
    durationSeconds
    matchScore
  }
}

mutation LinkGalleryVideo($galleryId: ID!, $pluginName: String!, $url: String!) {
  linkGalleryVideo(galleryId: $galleryId, pluginName: $pluginName, url: $url) {
    id
  }
}
