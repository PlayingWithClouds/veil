# Galleries, as the web's apps/web/src/lib/galleries.ts and library.ts read them.

# One page of recommended galleries.
query RecommendedGalleries($limit: Int, $offset: Int) {
  recommendations(filter: { kinds: [gallery] }, limit: $limit, offset: $offset) {
    record {
      __typename
      ... on Gallery {
        ...GalleryCardFields
      }
    }
  }
}

# Galleries the user opened, most recently viewed first.
query RecentlyViewedGalleries($limit: Int) {
  history(kind: gallery, limit: $limit) {
    record {
      __typename
      ... on Gallery {
        ...GalleryCardFields
      }
    }
  }
}

# Opens a gallery: reads its pages, which list the images.
mutation OpenGallery($id: ID!) {
  fetchGallery(id: $id) {
    ...GalleryCardFields
    details
    date
    studio {
      id
      name
    }
    performers {
      id
      name
      image {
        url
      }
    }
    tags {
      id
      name
    }
    images {
      id
      position
      width
      height
      asset {
        url
      }
    }
    video {
      id
    }
    userState {
      favorite
      rating
    }
  }
}

# The plugins, for the gallery sites the feed browses once the library runs out.
query GalleryPlugins {
  plugins {
    name
    enabled
    available
    capabilities
  }
}

# One page of a gallery site's catalog, stored in the library as it's listed.
mutation BrowseGalleries($plugin: String!, $limit: Int, $offset: Int) {
  browse(plugin: $plugin, kind: GALLERY, limit: $limit, offset: $offset) {
    galleries {
      ...GalleryCardFields
    }
  }
}

# One page of a search of the gallery sites: each site's answer as it comes, then it completes.
# The filter narrows the results, and its sources the sites asked.
subscription GallerySearchResults($query: String!, $page: Int, $filter: FilterInput) {
  searchResults(kind: GALLERY, query: $query, page: $page, filter: $filter) {
    exhausted
    listed {
      galleries {
        ...GalleryCardFields
      }
    }
  }
}

# The tags most common among the galleries matching a filter, for hiding.
query GalleryTagCounts($filter: FilterInput, $limit: Int) {
  mediaTagCounts(kind: gallery, filter: $filter, limit: $limit) {
    count
    tag {
      id
      name
    }
  }
}

# Galleries like one, most alike first.
query RelatedGalleries($id: ID!, $limit: Int) {
  related(subject: { kind: gallery, id: $id }, limit: $limit) {
    record {
      __typename
      ... on Gallery {
        ...GalleryCardFields
      }
    }
  }
}
