query HomeFeed(
  $limit: Int
  $offset: Int
  $refresh: Boolean
  $sources: [String!]
  $minDuration: Int
  $maxDuration: Int
) {
  recommendations(
    limit: $limit
    offset: $offset
    refresh: $refresh
    sources: $sources
    minDuration: $minDuration
    maxDuration: $maxDuration
  ) {
    source
    reason {
      kind
      text
    }
    scene {
      ...SceneCardFields
    }
  }
}

# Home with a tag chip or preset picked: a plain listing instead of the ranked feed.
query HomeScenes(
  $limit: Int
  $offset: Int
  $tagId: ID
  $sources: [String!]
  $minDuration: Int
  $maxDuration: Int
) {
  scenes(
    limit: $limit
    offset: $offset
    tagId: $tagId
    sources: $sources
    minDuration: $minDuration
    maxDuration: $maxDuration
  ) {
    ...SceneCardFields
  }
}

# The titled shelves interleaved into the feed.
query HomeRows($rowLimit: Int, $perRow: Int) {
  recommendedRows(rowLimit: $rowLimit, perRow: $perRow) {
    key
    title
    items {
      scene {
        ...SceneCardFields
      }
    }
  }
}

mutation RecordImpressions($impressions: [ImpressionInput!]!) {
  recordImpressions(impressions: $impressions)
}

query RandomScenes($limit: Int) {
  randomScenes(limit: $limit) {
    ...SceneCardFields
  }
}
