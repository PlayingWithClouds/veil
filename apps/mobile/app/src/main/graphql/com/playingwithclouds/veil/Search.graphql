# Searching the sites, as the web's apps/web/src/lib/search.ts and libraryFilter.ts do it.

# One page of a video search: each site's answer as it comes, then the subscription completes.
# The filter narrows the results, and its sources the sites asked; content ("cam-shows") asks only
# the sites carrying that kind.
subscription SearchResults($query: String!, $page: Int, $filter: FilterInput, $content: String) {
  searchResults(kind: VIDEO, query: $query, page: $page, filter: $filter, content: $content) {
    plugin
    sites
    final
    exhausted
    listed {
      videos {
        ...VideoCardFields
      }
      performers {
        ...PerformerCardFields
      }
    }
  }
}

query RecentSearches($limit: Int) {
  recentSearches(limit: $limit)
}

# The plugins, with the separate sites of those serving several, for the filter's site choices.
query VideoSites {
  plugins {
    name
    displayName
    iconUrl
    capabilities
    enabled
    available
    sites {
      name
      host
      iconUrl
    }
  }
}

# The tags most common among the videos matching a filter, for hiding.
query VideoTagCounts($filter: FilterInput, $limit: Int) {
  videoTagCounts(filter: $filter, limit: $limit) {
    count
    tag {
      id
      name
    }
  }
}
