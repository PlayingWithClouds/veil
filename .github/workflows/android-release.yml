# Builds the Android APK and publishes it as a GitHub release.
#
#   git tag v0.0.2 && git push origin v0.0.2      # or: Actions → Android release → Run workflow
#
# The tag (or the typed version) becomes the app's versionName; versionCode is derived
# from it in app/build.gradle.kts. The release carries veil-<version>.apk and veil.apk,
# the stable name the website's download button points at (releases/latest/download/veil.apk).
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   VEIL_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   VEIL_KEYSTORE_PASSWORD, VEIL_KEY_ALIAS, VEIL_KEY_PASSWORD
# Without them the job fails: an APK signed with a throwaway key can't update the last one.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, major.minor.patch (e.g. 0.0.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be major.minor.patch, got '$version'"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Only platform-tools: the action's default also asks for the long-gone `tools`
      # package and fails. Gradle downloads the platform and build-tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: |
          bun install --frozen-lockfile
          # Each scraper plugin is its own package with its own lockfile.
          for plugin in apps/backend/plugins/*/; do
            (cd "$plugin" && bun install --frozen-lockfile)
          done

      - name: Restore signing key
        env:
          VEIL_KEYSTORE_BASE64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$VEIL_KEYSTORE_BASE64" ]; then
            echo "::error::VEIL_KEYSTORE_BASE64 is not set; see the header of this workflow."
            exit 1
          fi
          echo "$VEIL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veil-release.jks"
          echo "VEIL_KEYSTORE_PATH=$RUNNER_TEMP/veil-release.jks" >> "$GITHUB_ENV"

      - name: Build backend, plugin bundles and APK
        working-directory: apps/mobile
        env:
          VEIL_KEYSTORE_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          VEIL_KEY_ALIAS: ${{ secrets.VEIL_KEY_ALIAS }}
          VEIL_KEY_PASSWORD: ${{ secrets.VEIL_KEY_PASSWORD }}
        run: |
          bun run build
          ./gradlew assembleRelease -PveilVersion=${{ steps.version.outputs.name }}

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp apps/mobile/app/build/outputs/apk/release/app-release.apk "dist/veil-${{ steps.version.outputs.name }}.apk"
          cp apps/mobile/app/build/outputs/apk/release/app-release.apk dist/veil.apk

      - uses: actions/upload-artifact@v5
        with:
          name: veil-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # Manual runs create the tag on the commit they built.
          gh release create "v$VERSION" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Veil $VERSION" \
            --generate-notes \
            --latest
